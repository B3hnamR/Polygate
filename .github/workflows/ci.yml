name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: bun test tests
      - run: docker build .
  windows:
    # GitHub-hosted disposable VM, never a contributor's Windows workstation.
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - run: npm ci --ignore-scripts
      - name: Prepare browser and native fixture toolchains
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path "$env:SystemRoot\Microsoft.NET\Framework64\v4.0.30319\csc.exe")) { throw 'Native restart fixture requires the .NET compiler' }
          if (!(Get-Command powershell.exe -ErrorAction SilentlyContinue)) { throw 'Native updater requires Windows PowerShell' }
          npx --no-install playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Chromium provisioning failed' }
      - name: Validate in the disposable VM with known toolchain egress blocked
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rule = 'Polygate-offline-validation'
          # App-level test guards are defense in depth, not the OS isolation boundary.
          # Block known executable paths, not the Actions runner's control channel.
          # Dynamically created/renamed executables are NOT covered: this is not
          # a full process-tree network sandbox. The disposable hosted VM is the
          # machine isolation boundary; app guards keep fixtures off production.
          $programs = @('bun','node','powershell.exe','pwsh','cmd.exe','git') | ForEach-Object { (Get-Command $_ -ErrorAction Stop).Source }
          $programs += "$env:SystemRoot\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $programs += 'C:\Program Files\Git\usr\bin\openssl.exe'
          $programs += @(Get-ChildItem "$env:LOCALAPPDATA\ms-playwright" -Filter *.exe -Recurse | ForEach-Object FullName)
          Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True
          try {
            foreach ($program in ($programs | Sort-Object -Unique)) {
              if (!(Test-Path -LiteralPath $program)) { throw "Missing offline fixture toolchain: $program" }
              New-NetFirewallRule -DisplayName $rule -Program $program -Direction Outbound -Action Block -Profile Any -RemoteAddress '0.0.0.0-126.255.255.255','128.0.0.0-255.255.255.255','::2-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff' | Out-Null
            }
            npm run check
            if ($LASTEXITCODE -ne 0) { throw 'Typecheck failed' }
            bun test tests
            if ($LASTEXITCODE -ne 0) { throw 'Full Windows test suite failed' }
            npm run test:windows-native
            if ($LASTEXITCODE -ne 0) { throw 'Native Windows gates failed' }
            [xml]$report = Get-Content -Raw build/verification/windows-native.xml
            $cases = @($report.SelectNodes('//testcase') | ForEach-Object {
              @{ name = $_.GetAttribute('name'); blocked = ($_.SelectNodes('.//skipped|.//failure|.//error|.//flakyFailure|.//rerunFailure').Count -ne 0) }
            })
            ConvertTo-Json -InputObject $cases -Depth 3 -Compress | bun scripts/verify-windows-native-report.ts
            if ($LASTEXITCODE -ne 0) { throw 'The seven expected native Windows cases must each pass exactly once' }
            npm run build:ui
            if ($LASTEXITCODE -ne 0) { throw 'UI build failed' }
            npm run verify:ui
            if ($LASTEXITCODE -ne 0) { throw 'Offline browser smoke failed' }
          } finally {
            Get-NetFirewallRule -DisplayName $rule -ErrorAction SilentlyContinue | Remove-NetFirewallRule
          }
      - name: Retain native test and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-validation-evidence
          path: build/verification/
          if-no-files-found: error
