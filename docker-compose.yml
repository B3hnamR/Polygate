services:
  polygate:
    build: .
    image: polygate:local
    restart: unless-stopped
    # Only the dashboard port is published, and only on this machine (127.0.0.1): it cannot clash with a web server on 80/443.
    # For built-in HTTPS add the second file: docker compose -f docker-compose.yml -f docker-compose.https.yml up -d
    ports:
      - "127.0.0.1:${POLYGATE_PANEL_PORT:-4317}:4317"
    volumes:
      - polygate-state:/data
    environment:
      POLYGATE_ADMIN_PASSWORD: "${POLYGATE_ADMIN_PASSWORD:-}"
      POLYGATE_ALLOWED_HOSTS: "${POLYGATE_ALLOWED_HOSTS:-*}"
      POLYGATE_COOKIE_SECURE: "${POLYGATE_COOKIE_SECURE:-auto}"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  polygate-state:
